<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Библиотека ИБ-отчётов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<!-- Версия для публикации на claude.ai (без doctype/html/head/body: обёртку добавляет платформа).
     Разметка совпадает с index.html — при изменении интерфейса правьте оба файла. -->

<header class="top">
  <div class="top-in">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Фильтры">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
    <div class="brand">
      <div class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12h6M9 15.5h4M9 8.5h6"/></svg></div>
      <div>Библиотека ИБ-отчётов<small>аналитика вендоров · выжимки на русском</small></div>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск: Qilin, CVE-2026-…, фишинг, Kaspersky…" autocomplete="off">
      <span class="kbd">/</span>
    </label>
    <div class="top-right">
      <div class="upd" id="upd"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Тема" title="Сменить тему">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<section class="reader" id="reader" aria-modal="true" role="dialog">
  <div class="r-bar">
    <span class="pos" id="rpos"></span>
    <button class="icon-btn" id="rPrev" title="Предыдущий (←)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="icon-btn" id="rNext" title="Следующий (→)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="icon-btn" id="rClose" title="Закрыть (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="r-body" id="rbody"></div>
</section>
<div class="toast" id="toast"></div>

<script src="data/vendors.js"></script>
<script src="data/manifest.js"></script>
<script src="app.js"></script>

</body></html>
